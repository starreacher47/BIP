stages: [lint, test, sast, build, scan, release]
variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
before_script: ["python --version"]
lint:
  stage: lint
  image: python:3.12
  script: ["pip install ruff bandit", "ruff check .", "bandit -r app analyzer -x tests"]
test:
  stage: test
  image: python:3.12
  script: ["pip install -r requirements.txt", "pytest"]
sonarqube:
  stage: sast
  image: sonarsource/sonar-scanner-cli:latest
  script: ["sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN"]
  rules: [{if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'}]
build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" .
    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
scan:
  stage: scan
  image: aquasec/trivy:latest
  script: ["trivy image --exit-code 1 --severity CRITICAL,HIGH $CI_REGISTRY_IMAGE:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"]
release:
  stage: release
  image: alpine:3.21
  rules: [{if: '$CI_COMMIT_TAG =~ /^v\\d+\\.\\d+\\.\\d+$/'}]
  script: ["apk add zip", "zip -r token-security-auditor-$CI_COMMIT_TAG.zip . -x '.git/*'"]
  artifacts: {paths: ["token-security-auditor-$CI_COMMIT_TAG.zip"]}
