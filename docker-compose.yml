services:
  auditor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env.docker
    ports:
      - "5000:5000"
      - "443:443"
    volumes:
      - app_data:/app/instance
      - ./certs:/app/certs:ro
    depends_on:
      - target
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - lab

  target:
    build:
      context: ./target_app
      dockerfile: Dockerfile
    environment:
      TARGET_URL: https://0.0.0.0:443
    expose:
      - "443"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - lab

networks:
  lab:

volumes:
  app_data: