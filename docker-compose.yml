services:
  auditor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env.docker
    ports:
      - "5000:5000"
      - "443:443"
    volumes:
      - app_data:/app/instance
      - ./certs:/app/certs:ro
    depends_on:
      - target
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - lab

  target:
    build:
      context: ./target_app
      dockerfile: Dockerfile
    environment:
      TARGET_URL: https://0.0.0.0:443
    expose:
      - "443"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - lab

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - lab

  node-exporter:
    image: prom/node-exporter:latest
    expose:
      - "9100"
    restart: unless-stopped
    networks:
      - lab

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Admin123!
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - lab

networks:
  lab:

volumes:
  app_data:
  grafana_data: