global:
  scrape_interval: 15s

scrape_configs:
  - job_name: token-auditor
    scheme: https
    static_configs:
      - targets: ['auditor:5000']
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']