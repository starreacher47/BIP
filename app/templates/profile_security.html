{% extends 'base.html' %}{% block content %}<h1>Профиль и безопасность</h1><div class="grid"><section class="card"><h2>Смена пароля</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="action" value="password"><label>Текущий пароль<input type="password" name="old_password" required></label><label>Новый пароль<input type="password" name="new_password" minlength="10" required></label><button>Изменить</button></form></section><section class="card"><h2>2FA TOTP</h2><p>Состояние: {{'включена' if user.otp_enabled else 'выключена'}}</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="action" value="{{'otp_disable' if user.otp_enabled else 'otp_enable'}}"><button>{{'Отключить' if user.otp_enabled else 'Включить'}} 2FA</button></form></section><section class="card"><h2>Аватар</h2><form method="post" action="{{url_for('main.avatar')}}" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="file" name="avatar" accept="image/png,image/jpeg" required><button>Загрузить</button></form></section></div>{% endblock %}
