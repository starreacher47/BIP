<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Token Security Auditor{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a class="brand" href="{{ url_for('main.index') }}">Token Security Auditor</a><nav><a href="{{ url_for('main.dashboard') }}">Кабинет</a><a href="{{ url_for('main.profile_security') }}">Безопасность</a>{% if session.get('role') in ['admin','superuser'] %}<a href="{{ url_for('main.admin') }}">Админ</a>{% endif %}<a href="{{ url_for('main.logout') }}">Выход</a></nav></header><main>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
