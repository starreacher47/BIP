name: CI
on:
  push: {branches: [main, master], tags: ['v*.*.*']}
  pull_request:
jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write, security-events: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt ruff bandit pytest
      - run: ruff check .
      - run: bandit -r app analyzer -x tests
      - run: pytest
      #- name: SonarQube SAST
      #  uses: SonarSource/sonarqube-scan-action@v5
      #  env: {SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}', SONAR_HOST_URL: '${{ secrets.SONAR_HOST_URL }}'}
      - run: docker build -t token-security-auditor:${{ github.sha }} .
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: token-security-auditor:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - run: zip -r token-security-auditor-${GITHUB_REF_NAME}.zip . -x '.git/*'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: {files: 'token-security-auditor-*.zip'}
